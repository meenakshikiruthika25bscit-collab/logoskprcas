<!DOCTYPE html>
<html>
<head>
    <title>College Login</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f2f2f2;
        }

        .login-box{
            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        img{
            width:120px;
            margin-bottom:15px;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0;
        }

        button{
            padding:10px 20px;
            background:blue;
            color:white;
            border:none;
        }
    </style>
</head>
<body>

<div class="login-box">
    <img src="logo.png" alt="College Logo">

    <h2>Student Login</h2>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <button>Login</button>
</div>

</body>
</html>
